name: Chat test

# Run by hand from the Actions tab: an AI plays the customer across several
# scenarios and talks to the real bot prompt, then the transcript and any policy
# breaks appear in the run log. Needs the GEMINI_API_KEY repository secret.
on:
  # A `schedule:` trigger for 05:00 UTC was tried here and removed: GitHub logged
  # zero runs with event=schedule over 2h13m past the fire time (confirmed via
  # the Actions API), likely because top-of-the-hour cron slots see the heaviest
  # global load and can be dropped rather than merely delayed. Trigger soak runs
  # by hand (workflow_dispatch) instead.
  workflow_dispatch:
    inputs:
      model:
        description: "โมเดลที่จะทดสอบ เช่น gemini-3.1-flash-lite (เว้นว่าง = ใช้ค่าเริ่มต้นของระบบ)"
        required: false
        type: string
      scenario:
        description: "รันเฉพาะ scenario ที่ชื่อมีคำนี้ (เว้นว่าง = รันทั้งหมด ~15 request)"
        required: false
        type: string
      duration:
        description: "รันวนซ้ำยาว ๆ เช่น 2h, 90m (เว้นว่าง = รันรอบเดียว) — ต้องใส่ budget ด้วย"
        required: false
        type: string
      budget:
        description: "เพดานจำนวน request ทั้งรัน เช่น 60 (เว้นว่าง = ไม่จำกัด)"
        required: false
        type: string
      gap_ms:
        description: "เว้นจังหวะระหว่าง request (มิลลิวินาที) เว้นว่างให้คำนวณเองจาก duration/budget"
        required: false
        type: string
      ai_customer:
        description: "ให้ AI ด้นบทลูกค้าเอง (สมจริงกว่า แต่ใช้โควตาเกือบสองเท่า)"
        required: false
        default: false
        type: boolean

jobs:
  chat:
    name: Simulated conversations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Talk to the bot
        # A soak run must outlive the default job timeout.
        timeout-minutes: 360
        run: |
          npm run test:chat -- "${{ inputs.scenario }}" \
            ${{ inputs.duration && format('--duration={0}', inputs.duration) || '' }} \
            ${{ inputs.budget && format('--budget={0}', inputs.budget) || '' }} \
            ${{ inputs.gap_ms && format('--gap={0}', inputs.gap_ms) || '' }} \
            ${{ inputs.ai_customer && '--ai-customer' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Blank falls through to the code default, so the input can be left empty.
          GEMINI_MODEL: ${{ inputs.model }}
