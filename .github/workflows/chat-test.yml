name: Chat test

# Run by hand from the Actions tab: an AI plays the customer across several
# scenarios and talks to the real bot prompt, then the transcript and any policy
# breaks appear in the run log. Needs the GEMINI_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "โมเดลที่จะทดสอบ เช่น gemini-3.1-flash-lite (เว้นว่าง = ใช้ค่าเริ่มต้นของระบบ)"
        required: false
        type: string
      scenario:
        description: "รันเฉพาะ scenario ที่ชื่อมีคำนี้ (เว้นว่าง = รันทั้งหมด ~15 request)"
        required: false
        type: string
      ai_customer:
        description: "ให้ AI ด้นบทลูกค้าเอง (สมจริงกว่า แต่ใช้โควตาเกือบสองเท่า)"
        required: false
        default: false
        type: boolean

jobs:
  chat:
    name: Simulated conversations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Talk to the bot
        run: npm run test:chat -- "${{ inputs.scenario }}" ${{ inputs.ai_customer && '--ai-customer' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Blank falls through to the code default, so the input can be left empty.
          GEMINI_MODEL: ${{ inputs.model }}
