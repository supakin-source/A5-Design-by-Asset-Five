name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No real credentials are needed: every page that touches the database is
# rendered on demand, so this placeholder is never connected to. Prisma only
# needs the variable to exist to load the schema.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      # Policy checks on the bot's replies. No API key needed — these test the
      # rules themselves, not a live conversation (see the chat-test workflow).
      - name: Unit tests
        run: npm test

      # `next build` also runs the TypeScript typecheck.
      - name: Build
        run: npx next build
